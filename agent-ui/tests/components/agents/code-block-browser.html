<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code block wrap checks</title>
    <style>
      body { overflow: auto !important; padding: 24px; }
      #fixtures { width: 360px; max-width: 100%; margin-block: 24px; }
      #results { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <button id="run" type="button">Run code block checks</button>
    <pre id="results" role="status">Ready</pre>
    <div id="fixtures"></div>
    <p>Keyboard check: Tab to Word wrap, then press Space and Enter.</p>
    <script type="module" src="./code-block-browser.tsx"></script>
  </body>
</html>
