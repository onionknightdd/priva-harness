# ONLYOFFICE Docs (Document Server) all-in-one for local minikube testing.
# One container bundles nginx, Document Server, PostgreSQL, RabbitMQ, and Redis.
#
# Apply:
#   kubectl apply -f deploy/onlyoffice/all-in-one.yaml
# Access:
#   kubectl -n onlyoffice port-forward svc/onlyoffice 8080:80
# Then open http://localhost:8080/welcome/ and http://localhost:8080/example/
#
# 9.4 example workaround: the bundled example fetches meta/config from siteUrl.
# production-linux defaults to "/", which Node fetch cannot resolve, so /example/
# crashes with "languages.forEach is not a function". Point siteUrl at the
# port-forward URL and listen on loopback :8080 so that fetch stays in-pod.
#
# JWT is off for local example testing. With JWT on, /example/download returns 403
# (jwt must be provided) and the editor shows "Download failed."
#
# The startup helper waits for storage.fs.secretString and copies it into the
# active nginx secure_link secret. Reloading ds.conf too early leaves the
# default "verysecretstring", so /cache/.../Editor.bin is 403 and the editor
# shows "Download failed."
---
apiVersion: v1
kind: Namespace
metadata:
  name: onlyoffice
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: onlyoffice-example-fix
  namespace: onlyoffice
data:
  production-linux.json: |
    {
      "server": {
        "siteUrl": "http://127.0.0.1:8080/",
        "storageFolder": "/var/lib/onlyoffice/documentserver-example/files",
        "enableForgotten": false
      }
    }
  fix-nginx-8080.sh: |
    #!/bin/bash
    set +e
    secret=""
    for _ in $(seq 1 120); do
      if [ -f /etc/onlyoffice/documentserver/local.json ]; then
        secret=$(python3 -c "import json,os; p='/etc/onlyoffice/documentserver/local.json'; print(json.load(open(p)).get('storage',{}).get('fs',{}).get('secretString','') if os.path.exists(p) else '')")
      fi
      if [ -n "$secret" ] && [ -f /etc/nginx/conf.d/ds.conf ]; then
        break
      fi
      sleep 1
    done
    for f in /etc/nginx/conf.d/ds.conf /etc/onlyoffice/documentserver/nginx/ds.conf; do
      if [ -f "$f" ] && ! grep -q "listen 127.0.0.1:8080" "$f"; then
        sed -i "s/listen 0.0.0.0:80;/listen 0.0.0.0:80;\\n  listen 127.0.0.1:8080;/" "$f"
      fi
    done
    if [ -n "$secret" ] && [ -f /etc/nginx/conf.d/ds.conf ]; then
      sed -i "s/set \$secure_link_secret .*/set \$secure_link_secret ${secret};/" /etc/nginx/conf.d/ds.conf
    fi
    nginx -s reload
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  namespace: onlyoffice
  labels:
    app: onlyoffice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onlyoffice
  template:
    metadata:
      labels:
        app: onlyoffice
    spec:
      containers:
        - name: documentserver
          image: onlyoffice/documentserver:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              bash /usr/local/bin/fix-nginx-8080.sh >/tmp/fix-nginx-8080.log 2>&1 &
              exec /app/ds/run-document-server.sh
          ports:
            - name: http
              containerPort: 80
          env:
            - name: JWT_ENABLED
              value: "false"
            - name: EXAMPLE_ENABLED
              value: "true"
            - name: ALLOW_PRIVATE_IP_ADDRESS
              value: "true"
            - name: ALLOW_META_IP_ADDRESS
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3500Mi
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/www/onlyoffice/Data
            - name: lib
              mountPath: /var/lib/onlyoffice
            - name: logs
              mountPath: /var/log/onlyoffice
            - name: example-fix
              mountPath: /etc/onlyoffice/documentserver-example/production-linux.json
              subPath: production-linux.json
            - name: example-fix
              mountPath: /usr/local/bin/fix-nginx-8080.sh
              subPath: fix-nginx-8080.sh
      volumes:
        - name: data
          emptyDir: {}
        - name: lib
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: example-fix
          configMap:
            name: onlyoffice-example-fix
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: onlyoffice
  namespace: onlyoffice
  labels:
    app: onlyoffice
spec:
  type: NodePort
  selector:
    app: onlyoffice
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
