      summary: Get safe public Agent descriptor
      description: Anonymous access only if active accessMode is public. api_key mode requires a key for
        this Agent; missing/wrong-Agent authorization returns 404 to avoid existence disclosure. An
        explicitly supplied invalid token never falls back to anonymous.
      security:
        - AgentApiKey: []
        - {}
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
