        - lastAcknowledgedSeq
        - status
        - output
        - error
        - reportedUsage
      description: Server reconciles broker metering, validates references, appends exactly one
        run.finished, and commits quota settlement atomically. Failed status requires error. An
        identical retry returns the existing terminal snapshot; conflicting terminal result is 409.
x-design-invariants:
  - No route here is implemented by this document.
  - All non-upload JSON bodies reject undeclared properties; impose global encoded-body limits as
    well as schema limits.
  - Session tokens authorize resources; resource IDs and API keys alone never expose other caller
    histories.
  - Owner APIs and private resource/file APIs must not be reachable with public session/Agent
    credentials.
  - Snapshot and activation digests bind reviewed bytes; credentials stay outside bundles and
    sandboxes.
  - Any failed sandbox probe prevents execution. No local execution fallback.
  - Anonymous Idempotency-Key is a 128-bit-or-stronger temporary secret used only for replaying
    creation for that Agent.
  - Closed execution sessions may retain read-only results until data expiry unless explicitly
    deleted or revoked.
