# Proposed contract. Not implemented. See ../architecture/published-agents.md
# Superseded 2026-10-22: the /api/v1 invocation routes and public events are replaced by
# ../architecture/agent-api-v1.md (/api/agent/v1/published/{agt}/...). Owner-side publishing
# routes remain a reference only; publishing is now implemented in agent-workshop agent-studio.
openapi: 3.1.1
info:
  title: Priva Published Agents API — proposed V1
  version: 0.1.0-draft
  description: DESIGN ONLY, not implemented. See docs/architecture/published-agents.md. Owner and
    public APIs use separate authenticated ingress; internal endpoints use mTLS on non-public
    listeners. Unknown fields are rejected. The runtime, access-mode and snapshot assumptions are
    pending product confirmation. Public stream version 1 is separate from the private harness
    stream protocol. Every ID lookup must additionally verify owner/session/lease scope.
servers:
  - url: /
    description: Relative to the appropriate owner, public or internal listener; these need not share a host.
tags:
  - name: Capabilities
  - name: Credentials
  - name: Agents
  - name: Drafts
  - name: Releases
  - name: Access
  - name: Observability
  - name: Public agents
  - name: Sessions
  - name: Runs
  - name: Files
  - name: Internal exports
  - name: Internal execution
paths:
  /api/sandbox/publishing/capabilities:
    get:
      operationId: getPublishingCapabilities
      tags:
        - Capabilities
      summary: Get tested runtime capabilities and policy choices
      security:
        - OwnerIdentity: []
      responses:
        "200":
          description: Get tested runtime capabilities and policy choices
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/publishing/model-sources:
    get:
      operationId: listPublishingModelSources
      tags:
        - Credentials
      summary: List sanitized private model-profile choices for publishing
      description: Read-only owner-side projection. Current private profiles list and detail both include
        auth_token, so do not reuse those payloads in the publishing UI. Return no auth token or raw
        config. Model IDs can be discovered via the existing authenticated profile models endpoint;
        creation validates the chosen profile/model pair.
      security:
        - OwnerIdentity: []
      responses:
        "200":
          description: List sanitized private model-profile choices for publishing
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSourceList"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/publishing/credential-bindings:
    get:
      operationId: listCredentialBindings
      tags:
        - Credentials
      summary: List owner credential binding metadata
      security:
        - OwnerIdentity: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List owner credential binding metadata
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialBindingPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCredentialBinding
      tags:
        - Credentials
      summary: Import a selected existing credential into a scoped server-side binding
      description: Requires owner authorization and a matching private Runner. The owner adapter imports
        secrets directly into a vault. No secret values appear in the draft, export bundle, public
        API or response. Poll the owner binding list for pending/active/failed state. MCP scope must
        already be enforceable.
      security:
        - OwnerIdentity: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialBindingCreate"
      responses:
        "202":
          description: Import a selected existing credential into a scoped server-side binding
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialBinding"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/publishing/credential-bindings/{bindingId}:
    get:
      operationId: getCredentialBinding
      tags:
        - Credentials
      summary: Read one owner binding without secret material
      security:
        - OwnerIdentity: []
      parameters:
        - name: bindingId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "200":
          description: Read one owner binding without secret material
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialBinding"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeCredentialBinding
      tags:
        - Credentials
      summary: Revoke binding and request cancellation of dependent executions
      description: Idempotent. Admission and broker authorization stop transactionally; already-started
        external side effects may finish.
      security:
        - OwnerIdentity: []
      parameters:
        - name: bindingId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "202":
          description: Revoke binding and request cancellation of dependent executions
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialBinding"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/publishing/credential-bindings/{bindingId}/refresh:
    post:
      operationId: refreshCredentialBindingSecret
      tags:
        - Credentials
      summary: Refresh secret from the original source while preserving immutable scope
      description: Owner-side adapter rereads the exact original source; succeeds only if
        endpoint/model/resource authorization matches the binding configuration. Atomically rotate
        vault material after verification, retain the old material on failure. No arbitrary secret
        in request/response; no change to configuration revision. If scope or upstream changes,
        return 409 and require a new binding/release. Revoked bindings cannot be revived.
      security:
        - OwnerIdentity: []
      parameters:
        - name: bindingId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
              required: []
      responses:
        "200":
          description: Refresh secret from the original source while preserving immutable scope
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialBinding"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/published-agents:
    get:
      operationId: listPublishedAgents
      tags:
        - Agents
      summary: List owner published Agents
      security:
        - OwnerIdentity: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List owner published Agents
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPublishedAgent
      tags:
        - Agents
      summary: Create an inactive Agent with an editable initial draft
      security:
        - OwnerIdentity: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreate"
      responses:
        "201":
          description: Create an inactive Agent with an editable initial draft
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Strong revision ETag for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/published-agents/{agentId}:
    get:
      operationId: getPublishedAgent
      tags:
        - Agents
      summary: Get owner Agent metadata
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "200":
          description: Get owner Agent metadata
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Strong revision ETag for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePublishedAgent
      tags:
        - Agents
      summary: Update Agent name and description
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPatch"
      responses:
        "200":
          description: Update Agent name and description
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Strong revision ETag for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: archivePublishedAgent
      tags:
        - Agents
      summary: Disable and archive Agent; asynchronously cancel sessions and clean data
      description: Returns archiving/archived. No new admission after the transaction commits. Owner
        metadata remains readable through the retention period; does not hard-delete unrelated
        native resources.
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "202":
          description: Disable and archive Agent; asynchronously cancel sessions and clean data
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Strong revision ETag for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/published-agents/{agentId}/draft:
    get:
      operationId: getAgentDraft
      tags:
        - Drafts
      summary: Read the full editable draft
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "200":
          description: Read the full editable draft
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Strong revision ETag for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: replaceAgentDraft
      tags:
        - Drafts
      summary: Replace the full draft
      description: The draft revision is independent of Agent metadata and activation revisions.
        Referenced resources are resolved on the authenticated owner Runner only. Does not change a
        release.
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftSpec"
      responses:
        "200":
          description: Replace the full draft
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Strong revision ETag for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/published-agents/{agentId}/releases:
    get:
      operationId: listAgentReleases
      tags:
        - Releases
      summary: List immutable release builds
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List immutable release builds
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleasePage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAgentRelease
      tags:
        - Releases
      summary: Freeze the requested draft revision and queue an isolated release build
      description: 409 if draftRevision is stale. A worker snapshots approved bytes and probes executable
        dependencies inside a build sandbox. No host-side MCP execution. Does not activate the
        release.
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseCreate"
      responses:
        "202":
          description: Freeze the requested draft revision and queue an isolated release build
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/published-agents/{agentId}/releases/{releaseId}:
    get:
      operationId: getAgentRelease
      tags:
        - Releases
      summary: Get build status, checks and immutable digests
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "200":
          description: Get build status, checks and immutable digests
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/published-agents/{agentId}/releases/{releaseId}/manifest:
    get:
      operationId: getReleaseManifest
      tags:
        - Releases
      summary: Read the final authorization manifest
      description: Only ready/revoked releases with a completed manifest. Includes owner source paths for
        review; never includes secret values. 409 while the manifest is incomplete.
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Read the final authorization manifest
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestPage"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/published-agents/{agentId}/releases/{releaseId}/preview-sessions:
    post:
      operationId: createReleasePreviewSession
      tags:
        - Releases
      summary: Create an owner-only preview session using the real isolated runtime
      description: Requires ready release but no activation. The returned session token uses the same
        public session/run APIs and enforcement as normal invocation. Charge preview usage to the
        owner.
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "201":
          description: Create an owner-only preview session using the real isolated runtime
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionGrant"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/published-agents/{agentId}/releases/{releaseId}/revoke:
    post:
      operationId: revokeAgentRelease
      tags:
        - Releases
      summary: Revoke release and close sessions pinned to it
      description: Idempotent. If this is the active release, atomically disable activation. Existing
        external side effects cannot be guaranteed reversible.
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
              required: []
      responses:
        "202":
          description: Revoke release and close sessions pinned to it
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/published-agents/{agentId}/activation:
    get:
      operationId: getAgentActivation
      tags:
        - Access
      summary: Read active release and access mode
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "200":
          description: Read active release and access mode
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Strong revision ETag for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activation"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: activateAgentRelease
      tags:
        - Access
      summary: Activate exactly the reviewed ready release
      description: Requires matching manifestDigest, passed checks, live bindings and platform capability.
        New sessions pin this release; existing sessions keep their prior release. public requires
        anonymous support and a positive budget. Changing public to api_key invalidates anonymous
        sessions; key sessions remain subject to their grants.
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationPut"
      responses:
        "200":
          description: Activate exactly the reviewed ready release
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Strong revision ETag for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activation"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deactivatePublishedAgent
      tags:
        - Access
      summary: Stop admission and request closure of all non-preview sessions
      description: No admission or new broker authorization after the revocation transaction. Cancellation
        and process exit are asynchronous. Existing owner previews remain isolated and can be closed
        independently; archiving/release revocation closes them too.
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "202":
          description: Stop admission and request closure of all non-preview sessions
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Strong revision ETag for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activation"
        default:
          $ref: "#/components/responses/Error"
  /api/sandbox/published-agents/{agentId}/keys:
    get:
      operationId: listAgentApiKeys
      tags:
        - Access
      summary: List key metadata without secrets
      security:
        - OwnerIdentity: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
