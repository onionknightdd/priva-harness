  /api/v1/agents/{agentId}/sessions:
    post:
      operationId: createInvocationSession
      tags:
        - Sessions
      summary: Create a caller-private session pinned to the active release
      description: Creates authorization/state only; allocate the dedicated Pod when the first run passes
        admission. Enforce maxActiveSessions including idle/logical sessions. Anonymous creation
        requires public mode and multi-dimensional rate limits. API key sessions inherit key
        revocation and expiry. The caller cannot choose release, provider, cwd or model. Invalid
        supplied credentials do not fall back to anonymous. Anonymous retries are scoped to agentId
        + high-entropy Idempotency-Key; keys must be client-generated with at least 128 bits of
        entropy and are treated as temporary secrets, never logged. IP is only a rate-limit signal,
        not session ownership.
      security:
        - AgentApiKey: []
        - {}
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "201":
          description: Create a caller-private session pinned to the active release
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionGrant"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{sessionId}:
    get:
      operationId: getInvocationSession
      tags:
        - Sessions
      summary: Get this capability-owned session
      security:
        - SessionToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "200":
          description: Get this capability-owned session
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: closeInvocationSession
      tags:
        - Sessions
      summary: Close the session and cancel its active run
      description: Idempotent, revokes new execution immediately. The same token can only poll this
        closing/closed session for bounded cleanup status; content/run/file grants are revoked by
        explicit deletion. Physical cleanup is asynchronous.
      security:
        - SessionToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "202":
          description: Close the session and cancel its active run
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{sessionId}/messages:
    get:
      operationId: listInvocationMessages
      tags:
        - Sessions
      summary: List committed messages in this session
      description: Stable creation order. Streaming partial assistant messages are in the run snapshot
        until completed. Messages may reference expired/deleted input files; no private provider
        history.
      security:
        - SessionToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List committed messages in this session
          headers:
