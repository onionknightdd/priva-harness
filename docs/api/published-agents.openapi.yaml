  /api/v1/sessions/{sessionId}/runs:
    post:
      operationId: createInvocationRun
      tags:
        - Runs
      summary: Queue one run in this session
      description: One non-terminal run per session; otherwise RUN_BUSY. Reserve quota transactionally
        before returning. HTTP disconnect does not cancel execution. Reject unknown config fields
        and cross-session file IDs. An expired/closed execution session cannot start a run even when
        its token still permits reading old results.
      security:
        - SessionToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreate"
      responses:
        "202":
          description: Queue one run in this session
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/runs/{runId}:
    get:
      operationId: getInvocationRun
      tags:
        - Runs
      summary: Get the authoritative run snapshot and current event cursor
      security:
        - SessionToken: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "200":
          description: Get the authoritative run snapshot and current event cursor
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/runs/{runId}/events:
    get:
      operationId: streamInvocationRun
      tags:
        - Runs
      summary: Replay and stream public SSE events
      description: No cursor means 0. Header/query cursors must agree if both supplied. Ordered durable
        sequence per run; delivery at least once. SSE id = seq, event = type, data = PublicEvent
        JSON. Comment heartbeat ~15 seconds, no proxy buffering. Cursor too new => 400; purged
        cursor => 410 EVENT_CURSOR_EXPIRED with snapshotPath. Replay terminal run through
        run.finished, then close. Disconnect does not cancel. Recheck revocation while streaming.
        Browser uses fetch Authorization rather than token in URL.
      security:
        - SessionToken: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            pattern: ^(0|[1-9][0-9]*)$
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: SSE stream. On terminal event close normally; on transport loss reconnect from last
            handled seq.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
            Cache-Control:
              schema:
                type: string
              description: no-store
            X-Accel-Buffering:
              schema:
                type: string
              description: Disable response buffering; the value is "no".
          content:
            text/event-stream:
              schema:
                type: string
              example: |+
                id: 1
                event: run.status
                data: {"v":1,"runId":"run_example","seq":1,"createdAt":"2026-09-28T00:00:00Z","type":"run.status","data":{"status":"queued"}}

          x-event-schema:
            $ref: "#/components/schemas/PublicEvent"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/runs/{runId}/cancel:
    post:
      operationId: cancelInvocationRun
      tags:
        - Runs
      summary: Request idempotent cancellation
      description: Returns cancelling or the already-existing terminal state. Do not claim stopped until
        cancelled or another terminal result is persisted. Supervisor cancels all run child tasks.
      security:
        - SessionToken: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
              required: []
      responses:
        "202":
          description: Request idempotent cancellation
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/runs/{runId}/interactions/{interactionId}/responses:
    post:
      operationId: respondToInvocationInteraction
      tags:
        - Runs
      summary: Answer a current business interaction
      description: Validate interaction ownership, deadline and exact choice/text limits. Same interaction
        and answer is idempotent; different second answer => 409. Cannot approve expanded file,
        network, credential or command permissions.
      security:
        - SessionToken: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - name: interactionId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionResponse"
      responses:
        "202":
          description: Answer a current business interaction
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{sessionId}/files:
    post:
      operationId: uploadInvocationFile
      tags:
        - Files
      summary: Upload one input file into this active session
      description: Exactly one file part. Platform/Agent limits and MIME support are checked while
        streaming. Server chooses storage path; client filename is display-only. Do not extract
        archives. No external download URL or relative/absolute destination path input. Orphaned
        retries count against quota and are cleaned with the session.
      security:
        - SessionToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUpload"
      responses:
        "201":
          description: Upload one input file into this active session
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{fileId}:
    get:
      operationId: getInvocationFile
      tags:
        - Files
      summary: Get metadata for a session-owned input file
      security:
        - SessionToken: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "200":
          description: Get metadata for a session-owned input file
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteInvocationFile
      tags:
        - Files
      summary: Delete a session input file not used by a non-terminal run
      description: 409 FILE_IN_USE while referenced by queued/running/waiting/cancelling run. Idempotent
        for a deleted file owned by this session. No host path lookup.
      security:
        - SessionToken: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "204":
          description: Delete a session input file not used by a non-terminal run
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/runs/{runId}/artifacts:
    get:
      operationId: listInvocationArtifacts
      tags:
        - Files
      summary: List published output artifacts owned by this run
      security:
        - SessionToken: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List published output artifacts owned by this run
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/artifacts/{artifactId}/content:
    get:
      operationId: downloadInvocationArtifact
      tags:
        - Files
      summary: Download an authorized immutable artifact
      description: Validate owning session and data expiry before download. Recheck revocation for long
        downloads. Stream through the gateway, not a permanent public object URL. Attachment
        filename safely encoded; never serve untrusted HTML as a same-origin document.
      security:
        - SessionToken: []
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "200":
          description: Artifact bytes with registered safe media type; octet-stream is the fallback.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
            Content-Disposition:
              schema:
                type: string
              description: attachment with a safely encoded display filename
            Content-Length:
              schema:
                type: integer
                minimum: 0
              description: Validated artifact size
            X-Content-Type-Options:
              schema:
                type: string
              description: nosniff
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /internal/v1/worker-sessions/{sessionId}/next-run:
    post:
      operationId: claimNextSessionRun
      tags:
        - Internal execution
      summary: Claim or re-fetch the next execution for this dedicated session supervisor
      description: The mTLS identity is bound to this exact session and supervisor generation. Long-poll
        at most 25 seconds; 204 if no queued work. An already assigned live execution returns the
        same assignment to this supervisor; never start it twice. Atomically lease at most one
        execution per session. Closed/revoked session => 409 SESSION_CLOSED and supervisor exits. A
        lost generation is fenced, not silently replaced to resume side effects.
      security:
        - ServiceIdentity: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NextRunRequest"
      responses:
        "200":
          description: Claim or re-fetch the next execution for this dedicated session supervisor
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionAssignment"
        "204":
          description: No queued execution within the bounded wait; safe to poll again.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
        default:
          $ref: "#/components/responses/Error"
  /internal/v1/source-exports:
    post:
      operationId: createSourceExport
      tags:
        - Internal exports
      summary: Create an immutable owner-bound export job
      description: Only the control-plane identity assigned to this owner Runner. Verify signed
        exportGrant audience, owner/release/draft digest and expiry against the canonical spec
        bytes; grant must derive from authenticated persisted owner selection. Export authorized
        data and sanitized definitions only. Credential material goes directly to the configured
        vault via the owner binding adapter, never this bundle. No dynamic upload destinations.
      security:
        - ServiceIdentity: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceExportCreate"
      responses:
        "202":
          description: Create an immutable owner-bound export job
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceExport"
        default:
          $ref: "#/components/responses/Error"
  /internal/v1/source-exports/{exportId}:
    get:
      operationId: getSourceExport
      tags:
        - Internal exports
      summary: Read the matching release export state
      security:
        - ServiceIdentity: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "200":
          description: Read the matching release export state
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceExport"
        default:
          $ref: "#/components/responses/Error"
  /internal/v1/source-exports/{exportId}/content:
    get:
      operationId: downloadSourceExport
      tags:
        - Internal exports
      summary: Download a ready immutable export bundle
      description: Requires ready state, matching service owner/release scope and non-expired export;
        otherwise 409/404/410. Verify digest before use and enforce safe archive extraction.
      security:
        - ServiceIdentity: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      responses:
        "200":
          description: Immutable archive containing only approved source data and sanitized resource
            definitions.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
            X-Bundle-Digest:
              schema:
                type: string
                pattern: ^sha256:[a-f0-9]{64}$
              description: Expected sha256 digest of returned bytes
            Content-Length:
              schema:
                type: integer
                minimum: 0
              description: Bundle size
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /internal/v1/executions/{executionId}/heartbeat:
    post:
      operationId: heartbeatExecution
      tags:
        - Internal execution
      summary: Renew a live execution lease within its fixed deadline
      description: Validate supervisor certificate identity and lease epoch. Stale lease => 409
        EXECUTION_FENCED. Expired/revoked jobs return cancel or reject; the supervisor terminates
        the sandbox if unable to renew before its known deadline.
      security:
        - ServiceIdentity: []
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Heartbeat"
      responses:
        "200":
          description: Renew a live execution lease within its fixed deadline
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResult"
        default:
          $ref: "#/components/responses/Error"
  /internal/v1/executions/{executionId}/events:
    post:
      operationId: appendExecutionEvents
      tags:
        - Internal execution
      summary: Append a bounded, ordered public event batch
      description: Persist before broadcast. Validate execution/session references, allowed transitions
        and per-message limits. Duplicate batchId/body returns original receipt, sequence
        gaps/conflicting duplicate => 409. This is not a generic privileged tool RPC.
      security:
        - ServiceIdentity: []
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatch"
      responses:
        "200":
          description: Append a bounded, ordered public event batch
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReceipt"
        default:
          $ref: "#/components/responses/Error"
  /internal/v1/executions/{executionId}/complete:
    post:
      operationId: completeExecution
      tags:
        - Internal execution
      summary: Commit one terminal result and reconcile reserved quota
      description: Only the current fenced supervisor; lastAcknowledgedSeq must match durable sequence.
        Commit terminal event, run snapshot and quota reconciliation together. Lost Worker is
        finalized by coordinator, not auto-replayed after external side effects.
      security:
        - ServiceIdentity: []
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            description: Opaque server-generated identifier; never an authorization grant.
            pattern: ^[a-z][a-z0-9_]{7,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionComplete"
      responses:
        "200":
          description: Commit one terminal result and reconcile reserved quota
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation identifier; also included in JSON error bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    OwnerIdentity:
      type: http
      scheme: bearer
      bearerFormat: OIDC access token
      description: Validate issuer, audience, expiry and owner binding. A cookie BFF may terminate this
        scheme only with explicit CSRF protection. Never trust caller-provided owner headers.
    AgentApiKey:
      type: http
      scheme: bearer
      bearerFormat: agent API key
      description: Allows descriptor and new sessions for exactly one active Agent. Does not enumerate or
        access previous sessions.
    SessionToken:
      type: http
      scheme: bearer
      bearerFormat: session capability
      description: One session and its descendant resources only; also check parent revocation epoch,
        execution TTL and data expiry. Agent API keys cannot substitute for this token.
    ServiceIdentity:
      type: mutualTLS
      description: Trusted control plane or supervisor identity with per-owner/per-execution
        authorization. Internal network reachability alone is insufficient.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: "Required for this operation. Scope: authenticated identity (or anonymous admission
        identity), route and key. 24-hour response retention. Different body => 409. Secret-bearing
        responses are encrypted at rest; replay revalidates policy."
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Strong ETag for this exact resource. Missing => 428; mismatch => 412. GET returns ETag.
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Inclusive UTC instant. Maximum report span 31 days.
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Exclusive UTC instant; greater than from.
  responses:
    Error:
      description: "Structured error. Statuses: 400 malformed input/cursor; 401 missing/invalid token; 403
        policy refusal; 404 absent or outside identity scope; 409 conflict; 410 expired data/cursor;
        412 stale revision; 413 upload/body too large; 422 validation; 428 missing If-Match; 429
        rate/budget limit; 500 internal failure; 503 unavailable. Cross-scope IDs use 404. 429
        includes Retry-After. No private paths or secrets."
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Correlation identifier; also included in JSON error bodies.
        Retry-After:
          schema:
            type: string
          description: Seconds before retry; required on 429 and optional on transient 503.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Id:
      type: string
      description: Opaque server-generated identifier; never an authorization grant.
      pattern: ^[a-z][a-z0-9_]{7,100}$
    Digest:
      type: string
      pattern: ^sha256:[a-f0-9]{64}$
    Harness:
      type: string
      enum:
        - claude
        - pi
    RunStatus:
      type: string
      enum:
        - queued
        - running
        - waiting_for_input
        - cancelling
        - completed
        - failed
        - cancelled
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - PRECONDITION_REQUIRED
        - REVISION_MISMATCH
        - IDEMPOTENCY_CONFLICT
        - RELEASE_NOT_READY
        - DRAFT_INVALID
        - SOURCE_CHANGED
        - SOURCE_UNAVAILABLE
        - SANDBOX_UNAVAILABLE
        - FEATURE_UNAVAILABLE
        - MCP_SCOPE_UNENFORCEABLE
        - PROFILE_BINDING_UNAVAILABLE
        - SESSION_CLOSED
        - SESSION_EXPIRED
        - TOKEN_EXPIRED
        - KEY_REVOKED
        - RELEASE_REVOKED
        - AGENT_INACTIVE
        - RUN_BUSY
        - RATE_LIMITED
        - BUDGET_EXCEEDED
        - UPLOAD_TOO_LARGE
        - FILE_IN_USE
        - EVENT_CURSOR_EXPIRED
        - INVALID_EVENT_CURSOR
        - INTERACTION_EXPIRED
        - INTERACTION_CONFLICT
        - INTERNAL_ERROR
        - WORKER_LOST
        - RUN_TIMEOUT
        - INTERACTION_TIMEOUT
        - MODEL_ERROR
        - MCP_ERROR
        - RESOURCE_EXHAUSTED
        - EXECUTION_FENCED
        - EVENT_SEQUENCE_GAP
        - INVALID_MANIFEST_CONFIRMATION
        - POLICY_DENIED
    ErrorDetails:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        snapshotPath:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 0
        currentRevision:
          type: integer
          minimum: 0
        checkIds:
          type: array
          items:
            type: string
      required: []
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Sanitized message; no secrets, raw prompts or private filesystem paths.
            requestId:
              type: string
            retryable:
              type: boolean
            details:
              $ref: "#/components/schemas/ErrorDetails"
          required:
            - code
            - message
            - requestId
            - retryable
      required:
        - error
    ExecutionError:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        retryable:
          type: boolean
      required:
        - code
        - message
        - retryable
    SourceRef:
      type: object
      additionalProperties: false
      properties:
        resourceId:
          type: string
          minLength: 1
          maxLength: 2048
        sourceId:
          type: string
          minLength: 1
          maxLength: 2048
      required:
        - resourceId
        - sourceId
    Limits:
      type: object
      additionalProperties: false
      properties:
        sessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        idleTtlSeconds:
          type: integer
          minimum: 30
          maximum: 3600
        maxRunsPerSession:
          type: integer
          minimum: 1
          maximum: 100
        runTimeoutSeconds:
          type: integer
          minimum: 10
          maximum: 900
        maxInputTokensPerRun:
          type: integer
          minimum: 1
          maximum: 1000000
        maxOutputTokensPerRun:
          type: integer
          minimum: 1
          maximum: 64000
        maxToolCallsPerRun:
          type: integer
          minimum: 0
          maximum: 500
        maxConcurrentRuns:
          type: integer
          minimum: 1
          maximum: 100
        maxActiveSessions:
          type: integer
          minimum: 1
          maximum: 1000
        dailyTokenBudget:
          type: integer
          minimum: 1
          maximum: 1000000000
        maxUploadFileBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        maxSessionUploadBytes:
          type: integer
          minimum: 1
          maximum: 52428800
      required:
        - sessionTtlSeconds
        - idleTtlSeconds
        - maxRunsPerSession
        - runTimeoutSeconds
        - maxInputTokensPerRun
        - maxOutputTokensPerRun
        - maxToolCallsPerRun
        - maxConcurrentRuns
        - maxActiveSessions
        - dailyTokenBudget
        - maxUploadFileBytes
        - maxSessionUploadBytes
      description: Draft limits. Platform/runtime limits may be lower. Idle TTL <= session TTL; max file
        bytes <= session bytes. UTC daily budget counts input + output tokens, including cached
        input once, across model calls. Broker reserves/enforces quota transactionally.
    PublicLimits:
      type: object
      additionalProperties: false
      properties:
        sessionTtlSeconds:
          type: integer
          minimum: 0
        idleTtlSeconds:
          type: integer
          minimum: 0
        maxRunsPerSession:
          type: integer
          minimum: 0
        runTimeoutSeconds:
          type: integer
          minimum: 0
        maxInputTextCharacters:
          type: integer
          minimum: 0
        maxUploadFileBytes:
          type: integer
          minimum: 0
        maxSessionUploadBytes:
          type: integer
          minimum: 0
      required:
        - sessionTtlSeconds
        - idleTtlSeconds
        - maxRunsPerSession
        - runTimeoutSeconds
        - maxInputTextCharacters
        - maxUploadFileBytes
        - maxSessionUploadBytes
    RuntimeProfile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Opaque server-generated identifier; never an authorization grant.
          pattern: ^[a-z][a-z0-9_]{7,100}$
        label:
          type: string
        harnesses:
          type: array
          items:
            $ref: "#/components/schemas/Harness"
          minItems: 1
        imageDigest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        sandboxPolicyVersion:
          type: string
        isolationVerified:
          type: boolean
        features:
          type: array
          items:
            type: string
        unavailableReason:
          anyOf:
            - type: string
            - type: "null"
      required:
        - id
        - label
        - harnesses
        - imageDigest
        - sandboxPolicyVersion
        - isolationVerified
        - features
        - unavailableReason
    ResourcePolicy:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Opaque server-generated identifier; never an authorization grant.
          pattern: ^[a-z][a-z0-9_]{7,100}$
        label:
          type: string
        mcpResourceId:
          type: string
        allowedTools:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        scopeSummary:
          type: string
        revision:
          type: integer
          minimum: 1
        enforceable:
          type: boolean
      required:
        - id
        - label
        - mcpResourceId
        - allowedTools
        - scopeSummary
        - revision
        - enforceable
    Capabilities:
      type: object
      additionalProperties: false
      properties:
        harnesses:
          type: array
          items:
            $ref: "#/components/schemas/Harness"
        runtimeProfiles:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeProfile"
        resourcePolicies:
          type: array
          items:
            $ref: "#/components/schemas/ResourcePolicy"
        supportedFeatures:
          type: array
          items:
            type: string
            enum:
              - skills
              - mcp_stdio
              - mcp_remote
              - files
              - anonymous
              - shell
              - interactions
        defaultLimits:
          $ref: "#/components/schemas/Limits"
        maximumLimits:
          $ref: "#/components/schemas/Limits"
        maxApiKeyTtlSeconds:
          type: integer
          minimum: 1
        resultRetentionSeconds:
          type: integer
          minimum: 1
        auditRetentionDays:
          type: integer
          minimum: 1
        maxCleanupDelaySeconds:
          type: integer
          minimum: 1
        sourceAvailable:
          type: boolean
      required:
        - harnesses
        - runtimeProfiles
        - resourcePolicies
        - supportedFeatures
        - defaultLimits
        - maximumLimits
        - maxApiKeyTtlSeconds
        - resultRetentionSeconds
        - auditRetentionDays
        - maxCleanupDelaySeconds
        - sourceAvailable
    ModelSource:
      type: object
      additionalProperties: false
      properties:
        profileId:
          type: string
          minLength: 1
          maxLength: 2048
        label:
          type: string
        defaultModel:
          anyOf:
            - type: string
            - type: "null"
        authConfigured:
          type: boolean
      required:
        - profileId
        - label
        - defaultModel
        - authConfigured
    ModelSourceList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelSource"
      required:
        - items
    ModelBindingCreate:
      type: object
      additionalProperties: false
      properties:
        kind:
          const: model
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 100
        modelProfileId:
          type: string
          description: Existing private model-profile identifier, preserving its native format.
          minLength: 1
          maxLength: 2048
        modelId:
          type: string
          description: Explicit selected upstream model, verified server-side and frozen into binding
            configuration.
          minLength: 1
          maxLength: 512
      required:
        - kind
        - name
        - modelProfileId
        - modelId
    McpCredentialBindingCreate:
      type: object
      additionalProperties: false
      properties:
        kind:
          const: mcp
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 100
        harness:
          $ref: "#/components/schemas/Harness"
        resourceCwd:
          type: string
          minLength: 1
        source:
          $ref: "#/components/schemas/SourceRef"
        resourcePolicyId:
          type: string
          description: Opaque server-generated identifier; never an authorization grant.
          pattern: ^[a-z][a-z0-9_]{7,100}$
      required:
        - kind
        - name
        - harness
        - resourceCwd
        - source
        - resourcePolicyId
    CredentialBindingCreate:
      oneOf:
        - $ref: "#/components/schemas/ModelBindingCreate"
        - $ref: "#/components/schemas/McpCredentialBindingCreate"
      discriminator:
        propertyName: kind
        mapping:
          model: "#/components/schemas/ModelBindingCreate"
          mcp: "#/components/schemas/McpCredentialBindingCreate"
    CredentialBinding:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Opaque server-generated identifier; never an authorization grant.
          pattern: ^[a-z][a-z0-9_]{7,100}$
        kind:
          type: string
          enum:
            - model
            - mcp
        name:
          type: string
        state:
          type: string
          enum:
            - pending
            - active
            - failed
            - revoked
        revision:
          type: integer
          minimum: 1
        scopeSummary:
          type: string
        resourcePolicyId:
          anyOf:
            - type: string
              description: Opaque server-generated identifier; never an authorization grant.
              pattern: ^[a-z][a-z0-9_]{7,100}$
            - type: "null"
        createdAt:
          type: string
          format: date-time
        revokedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        error:
          anyOf:
            - $ref: "#/components/schemas/ExecutionError"
            - type: "null"
      required:
        - id
        - kind
        - name
        - state
        - revision
        - scopeSummary
        - resourcePolicyId
        - createdAt
        - revokedAt
        - error
    SnapshotRoot:
      type: object
      additionalProperties: false
      properties:
        sourcePath:
          type: string
          description: Owner-only source path. Resolve on the authenticated owner Runner, never on a public
            Worker.
          minLength: 1
          maxLength: 4096
        alias:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,47}$
        mode:
          type: string
          enum:
            - read_only
            - workspace_template
        includePatterns:
          type: array
          items:
            type: string
          maxItems: 100
        excludePatterns:
          type: array
          items:
            type: string
          maxItems: 100
      required:
        - sourcePath
        - alias
        - mode
        - includePatterns
        - excludePatterns
      description: Unique aliases; at most one workspace_template. Patterns select snapshot contents, not
        a sandbox security boundary. Links and special files are rejected.
    McpBinding:
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/SourceRef"
        allowedTools:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
          maxItems: 100
        credentialBindingId:
          anyOf:
            - type: string
              description: Opaque server-generated identifier; never an authorization grant.
              pattern: ^[a-z][a-z0-9_]{7,100}$
            - type: "null"
        resourcePolicyId:
          anyOf:
            - type: string
              description: Opaque server-generated identifier; never an authorization grant.
              pattern: ^[a-z][a-z0-9_]{7,100}$
            - type: "null"
      required:
        - source
        - allowedTools
        - credentialBindingId
        - resourcePolicyId
      description: Exact tool allowlist. Remote MCP requires an enforceable registered resource policy
        even if it uses no secret. stdio dependencies must exist in the runtime profile. No raw
        secrets.
    ExecutionPolicy:
      type: object
      additionalProperties: false
      properties:
        runtimeProfileId:
          anyOf:
            - type: string
              description: Opaque server-generated identifier; never an authorization grant.
              pattern: ^[a-z][a-z0-9_]{7,100}$
            - type: "null"
        runMode:
          type: string
          enum:
            - agent
            - code
        effort:
          anyOf:
            - type: string
              enum:
                - low
                - medium
                - high
                - xhigh
                - max
            - type: "null"
        shellToolEnabled:
          type: boolean
        network:
          type: string
          const: brokers_only
      required:
        - runtimeProfileId
        - runMode
        - effort
        - shellToolEnabled
        - network
    DraftSpec:
      type: object
      additionalProperties: false
      properties:
        harness:
          $ref: "#/components/schemas/Harness"
        resourceCwd:
          type: string
          minLength: 1
          maxLength: 4096
        instructions:
          type: string
          maxLength: 100000
        contextRefs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
          maxItems: 50
        modelBindingId:
          anyOf:
            - type: string
              description: Opaque server-generated identifier; never an authorization grant.
              pattern: ^[a-z][a-z0-9_]{7,100}$
            - type: "null"
        snapshotRoots:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotRoot"
          maxItems: 20
        skillRefs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
          maxItems: 100
        mcpBindings:
          type: array
          items:
            $ref: "#/components/schemas/McpBinding"
          maxItems: 50
        execution:
          $ref: "#/components/schemas/ExecutionPolicy"
        limits:
          $ref: "#/components/schemas/Limits"
      required:
        - harness
        - resourceCwd
        - instructions
        - contextRefs
        - modelBindingId
        - snapshotRoots
        - skillRefs
        - mcpBindings
        - execution
        - limits
      description: Full draft. Null model/runtime binding is allowed while editing, but release creation
        rejects it. contextRefs select explicit Memory resources; no automatic private-session
        history. Existing resources are read via authenticated private APIs.
    Draft:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        spec:
          $ref: "#/components/schemas/DraftSpec"
      required:
        - revision
        - updatedAt
        - spec
    AgentCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        harness:
          $ref: "#/components/schemas/Harness"
      required:
        - name
        - harness
    AgentPatch:
      type: object
      additionalProperties: false
      properties:
